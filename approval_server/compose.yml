services:
  web:
    build:
      context: ..
      dockerfile: approval_server/Dockerfile
    env_file: .env
    volumes:
      - payments_data:/data
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped
  push:
    build:
      context: ..
      dockerfile: approval_server/Dockerfile
    env_file: .env
    volumes:
      - payments_data:/data
    command: ["python","-m","approval_server.push_worker"]
    restart: unless-stopped
    depends_on: [web]
    profiles: [push]
volumes:
  payments_data:
