name: AppBox native package
on:
  push:
    branches: [main]
    paths:
      - 'scripts/package-appbox.mjs'
      - '.github/workflows/appbox-package.yml'
      - 'src/**'
      - 'assets/**'
      - 'index.html'
      - 'package.json'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  appbox-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Existing application build and tests
        run: npm test
      - name: Create and validate AppBox ZIP
        run: |
          node scripts/package-appbox.mjs
          unzip -l release/VOLMAX-Payments-AppBox.appbox.zip
          sha256sum release/VOLMAX-Payments-AppBox.appbox.zip > release/VOLMAX-Payments-AppBox.appbox.zip.sha256
          sha256sum release/VOLMAX-Payments-AppBox-Standard.zip > release/VOLMAX-Payments-AppBox-Standard.zip.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: VOLMAX-Payments-AppBox
          path: |
            release/VOLMAX-Payments-AppBox.appbox.zip
            release/VOLMAX-Payments-AppBox.appbox.zip.sha256
            release/VOLMAX-Payments-AppBox-Standard.zip
            release/VOLMAX-Payments-AppBox-Standard.zip.sha256
          retention-days: 30
      - name: Publish AppBox candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(node -p 'require("./package.json").version')"
          TAG="appbox-v${VERSION}-candidate.${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" release/VOLMAX-Payments-AppBox.appbox.zip release/VOLMAX-Payments-AppBox.appbox.zip.sha256 release/VOLMAX-Payments-AppBox-Standard.zip release/VOLMAX-Payments-AppBox-Standard.zip.sha256 --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "ВОЛМАКС Payments AppBox ${VERSION}" --notes "AppBox stateless candidate. Test in AppBox preview before publishing." --prerelease
